spring.application.name=mercedes_shop
server.port=8080

# MongoDB configuration
spring.data.mongodb.uri=${env.MONGODB_URI}
spring.data.mongodb.database=${env.MONGODB_DATABASE}

# Cloudinary configuration
cloudinary.cloud-name=${env.CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${env.CLOUDINARY_API_KEY}
cloudinary.api-secret=${env.CLOUDINARY_API_SECRET}

# Google OAuth configuration
google.client-id=${env.GOOGLE_CLIENT_ID}
google.client-secret=${env.GOOGLE_CLIENT_SECRET}

# GitHub OAuth configuration
github.client-id=${env.GITHUB_CLIENT_ID}
github.client-secret=${env.GITHUB_CLIENT_SECRET}
# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging configuration - Turn OFF MongoDB logs completely
logging.level.org.springframework.data.mongodb.core.MongoTemplate=OFF
logging.level.org.mongodb.driver=OFF
logging.level.org.springframework.data.mongodb=OFF
logging.level.org.springframework.data=WARN
logging.level.org.example=INFO
logging.level.root=INFO